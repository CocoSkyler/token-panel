<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>Token 用量总览</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<style>
  :root{
    --bg:#04060a;
    --panel:#10151d;
    --card:#151b24;
    --card-2:#181f2a;
    --line:rgba(255,255,255,.055);
    --text:#f2f6fb;
    --muted:#8b96a5;
    --muted-2:#667383;
    --green:#35d08a;
    --orange:#ff9f43;
    --red:#f87171;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Consolas,"Cascadia Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 90% at 50% 0%,#0a0e14 0%,var(--bg) 60%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
    display:flex;justify-content:center;
    padding:max(10px,env(safe-area-inset-top)) 10px 22px;
    -webkit-tap-highlight-color:transparent;
  }
  .panel{
    width:100%;max-width:520px;height:max-content;
    background:linear-gradient(180deg,#121821 0%,var(--panel) 70%,#0d1219 100%);
    border:1px solid rgba(255,255,255,.05);
    border-radius:30px;
    box-shadow:0 24px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.04);
    padding:20px 16px 16px;
  }
  @media(min-width:720px){ body{padding-top:36px} }

  /* ---------- 头部 ---------- */
  .head{display:flex;align-items:center;gap:8px;padding:0 4px 14px;flex-wrap:wrap}
  .head h1{font-size:19px;font-weight:800;letter-spacing:.3px;margin-right:2px}
  .pill{
    font-size:11px;color:#c6cfdb;background:#1a212c;border:1px solid var(--line);
    padding:4px 9px;border-radius:999px;white-space:nowrap;
  }
  .head .right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .live{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#fff;
        background:rgba(53,208,138,.12);border:1px solid rgba(53,208,138,.35);
        padding:4px 10px;border-radius:999px}
  .live .dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite}
  .live.off{background:#1a212c;border-color:rgba(255,255,255,.09);color:var(--muted)}
  .live.off .dot{background:#4a5462;animation:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .ago{font-size:11px;color:var(--muted)}

  /* ---------- 卡片 ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  @media(max-width:379px){ .grid{grid-template-columns:1fr} }
  .card{
    background:linear-gradient(180deg,var(--card-2),var(--card));
    border:1px solid var(--line);border-radius:20px;padding:15px 15px 13px;
    min-width:0;
  }
  .card.wide{grid-column:1/-1}
  .ttl{font-size:13px;font-weight:600;color:#dbe3ec}

  .big{font-family:var(--mono);font-size:31px;font-weight:800;letter-spacing:.5px;line-height:1.15;margin-top:6px}
  .delta-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
  .delta{font-family:var(--mono);font-weight:800;font-size:13.5px;color:#06130c;
         background:var(--green);padding:3px 8px;border-radius:9px}
  .delta.bad{background:#fba05c;color:#1b0e02}
  .dim{font-size:12px;color:var(--muted)}
  .proj{margin-top:11px;font-size:12.5px;color:var(--muted)}
  .proj b{color:var(--orange);font-family:var(--mono);font-weight:700}

  /* 环形 */
  .donut-card{display:flex;flex-direction:column}
  .dn-body{display:flex;gap:14px;align-items:center;flex:1;margin-top:8px}
  .donut-wrap{position:relative;width:86px;height:86px;flex:none}
  .donut-wrap svg{transform:rotate(-90deg);width:100%;height:100%}
  .donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .donut-center b{font-family:var(--mono);font-size:19px;font-weight:800}
  .dn-sub{margin-left:auto;text-align:left;min-width:0;padding-right:2px}
  .dn-sub .pct-up{margin-top:8px;font-size:12px;font-weight:700;color:var(--green)}
  .dn-sub .pct-up.bad{color:#fba05c}

  /* 模型卡 */
  .model .row1{display:flex;align-items:center;gap:7px}
  .model .mdot{width:8px;height:8px;border-radius:50%;flex:none}
  .model .name{font-size:14px;font-weight:750}
  .model .share{margin-left:auto;font-size:11.5px;color:var(--muted)}
  .model .mid{display:flex;align-items:flex-end;gap:8px;margin-top:5px}
  .model .mv{font-family:var(--mono);font-size:24px;font-weight:800;line-height:1.1}
  .spark{margin-left:auto;width:86px;height:34px;flex:none;opacity:.95}
  .hit-row{display:flex;align-items:center;gap:8px;margin-top:11px}
  .track{flex:1;height:7px;border-radius:99px;background:#232b37;overflow:hidden}
  .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#fff3,var(--c,#a78bfa));
        transition:width .6s cubic-bezier(.22,.8,.32,1)}
  .hit-lab{font-size:11px;color:var(--muted);white-space:nowrap}

  /* 趋势图卡 */
  .trend-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .legend{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted);flex-wrap:wrap}
  .lg{display:flex;align-items:center;gap:4px}
  .lg i{width:7px;height:7px;border-radius:50%;display:inline-block}
  .trend-svg{width:100%;height:auto;display:block;margin-top:6px}

  .foot{text-align:center;color:#39424f;font-size:10.5px;margin-top:14px;user-select:none}
  .err{
    display:none;margin-bottom:10px;padding:9px 12px;border-radius:13px;font-size:12px;
    background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:#ffb4b4;
  }
</style>
</head>
<body>
<div class="panel" id="panel">
  <div class="err" id="err"></div>

  <div class="head">
    <h1>Token 用量总览</h1>
    <span class="pill">年累计 <b id="yearTotal">—</b></span>
    <div class="right">
      <span class="live" id="live"><span class="dot"></span><span id="liveTxt">LIVE</span></span>
      <span class="ago" id="ago"></span>
    </div>
  </div>

  <div class="grid">
    <!-- 今日总消耗 -->
    <div class="card">
      <div class="ttl">今日总消耗</div>
      <div class="big" id="todayTotal">—</div>
      <div class="delta-row">
        <span class="delta" id="delta">—</span>
        <span class="dim">昨日 <b id="yesterdayTotal" style="font-family:var(--mono)">—</b></span>
      </div>
      <div class="proj">预计全天 ≈ <b id="projection">—</b></div>
    </div>

    <!-- 今日 vs 7 日均值 -->
    <div class="card donut-card">
      <div class="ttl">今日 vs 7 日均值</div>
      <div class="dn-body">
        <div class="donut-wrap">
          <svg viewBox="0 0 96 96">
            <defs>
              <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#5eead4"/><stop offset="55%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#8b5cf6"/>
              </linearGradient>
            </defs>
            <circle cx="48" cy="48" r="41" fill="none" stroke="#202937" stroke-width="10"/>
            <circle id="ringFg" cx="48" cy="48" r="41" fill="none" stroke="url(#ringGrad)" stroke-width="10"
                    stroke-linecap="round" stroke-dasharray="0 257.6"/>
          </svg>
          <div class="donut-center"><b id="vsPct">—%</b></div>
        </div>
        <div class="dn-sub">
          <div style="font-size:10.5px;color:var(--muted);white-space:nowrap">7 日均值</div>
          <div style="font-family:var(--mono);font-size:19px;font-weight:800;margin-top:2px" id="prevAvg">—</div>
          <div class="pct-up" id="vsDelta">—</div>
        </div>
      </div>
    </div>

    <!-- 各模型卡片（动态） -->
    <div id="models"></div>

    <!-- 近7天趋势 -->
    <div class="card wide">
      <div class="trend-head">
        <div class="ttl" style="font-size:14.5px;font-weight:750">近 7 天趋势</div>
        <div class="legend" id="legend"></div>
      </div>
      <svg class="trend-svg" id="trendChart" viewBox="0 0 368 168"></svg>
    </div>
  </div>

  <div class="foot" id="footFoot">GLM TOKEN PANEL · <span id="genAt"></span></div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const REFRESH_MS = 60000;

/* ---------------- 工具 ---------------- */
function fmt(n){ // token 数 -> 16.7M / 1.67M / 218K 风格
  n = Number(n)||0;
  const seg=(v,d)=>(+v.toFixed(d)).toString();
  let v,d;
  if(Math.abs(n)>=1e9){ v=n/1e9; d=v>=100?0:v>=10?1:2; return seg(v,d)+'B'; }
  if(Math.abs(n)>=1e6){ v=n/1e6; d=v>=100?0:v>=10?1:2; return seg(v,d)+'M'; }
  if(Math.abs(n)>=1e3){ v=n/1e3; d=v<10?1:0; return seg(v,d)+'K'; }
  return String(Math.round(n));
}
function ago(ms){
  if(!ms) return '';
  const s=Math.max(0,(Date.now()-ms)/1000|0);
  if(s<60) return '刚刚';
  if(s<3600) return (s/60|0)+' 分钟前';
  if(s<86400) return (s/3600|0)+' 小时前';
  return (s/86400|0)+' 天前';
}
/* Catmull-Rom -> 三次贝塞尔平滑曲线 */
function smoothPath(pts){
  if(pts.length<2) return '';
  let p=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6];
    const c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    p+=`C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return p;
}

/* ---------------- 渲染 ---------------- */
let DATA=null;

function render(d){
  DATA=d;
  $('yearTotal').textContent=fmt(d.yearTotal);

  const liveEl=$('live');
  liveEl.classList.toggle('off',!d.live.active);
  $('liveTxt').textContent=d.live.active?'LIVE':'已暂停';
  $('ago').textContent=ago(d.live.lastActivityAt);

  const t=d.today||{};
  $('todayTotal').textContent=fmt(t.total);
  const diff=(t.total||0)-(t.yesterdayTotal||0);
  const de=$('delta');
  de.textContent=(diff<=0?'':'+')+fmt(diff);
  de.classList.toggle('bad',diff>0);
  $('yesterdayTotal').textContent=fmt(t.yesterdayTotal);
  $('projection').textContent=fmt(t.projection);

  const avg=d.prev7Avg||0;
  const ratio=avg>0?(t.total||0)/avg:0;
  $('prevAvg').textContent=fmt(avg);
  $('vsPct').textContent=Math.round(ratio*100)+'%';
  const vd=$('vsDelta');
  const vpct=avg>0?((ratio-1)*100):0;
  vd.textContent='较均值 '+(vpct>0?'+':'')+Math.round(vpct)+'%';
  vd.classList.toggle('bad',vpct>0);
  const C=2*Math.PI*41;
  $('ringFg').setAttribute('stroke-dasharray',`${Math.min(ratio,1)*C} ${C}`);

  renderModels(d);
  renderTrend(d);
  $('genAt').textContent=new Date(d.generatedAt).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
}

function renderModels(d){
  const wrap=$('models');
  const gs=(d.groups||[]).slice().sort((a,b)=>b.today-a.today);
  wrap.innerHTML='';
  wrap.style.display='contents';

  gs.forEach(g=>{
    const el=document.createElement('div');
    el.className='card model';
    const days=g.days.slice(-7).map(x=>x.total);
    el.innerHTML=`
      <div class="row1"><span class="mdot" style="background:${g.color}"></span>
        <span class="name">${esc(g.name)}</span><span class="share">占比 ${Math.round((g.todayShare||0)*100)}%</span></div>
      <div class="mid"><span class="mv" style="color:${g.color}">${fmt(g.today)}</span>
        <svg class="spark" viewBox="0 0 86 34">${spark(days,g.color)}</svg></div>
      <div class="hit-row"><div class="track"><div class="fill" style="--c:${g.color};width:${Math.round((g.hitRate||0)*100)}%"></div></div>
        <span class="hit-lab">命中 ${Math.round((g.hitRate||0)*100)}%</span></div>`;
    wrap.appendChild(el);
  });

  const lg=$('legend');
  lg.innerHTML='<span class="lg" style="color:#94a1b1">日均 '+fmt(d.prev7Avg)+'</span>'+
    gs.slice(0,4).map(g=>`<span class="lg"><i style="background:${g.color}"></i>${esc(g.name)}</span>`).join('');
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function spark(vals,color){
  const w=86,h=34,max=Math.max(...vals,1);
  const pts=vals.map((v,i)=>[2+i*(w-8)/Math.max(vals.length-1,1), h-5-(v/max)*(h-11)]);
  const line=smoothPath(pts)||`M2,${h/2}L${w-2},${h/2}`;
  const area=line+`L${w-2},${h} L2,${h} Z`;
  const gid='sg'+color.replace(/#/g,'')+Math.round(max)+vals.length+(vals[0]|0)+(vals[vals.length-1]|0);
  const last=pts[pts.length-1];
  return `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".28"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round"/>
    ${last?`<circle cx="${last[0]}" cy="${last[1]}" r="2.4" fill="#0b0f15" stroke="${color}" stroke-width="1.4"/>`:''}`;
}

function renderTrend(d){
  const svg=$('trendChart');
  const W=368,H=168,L=10,R=W-12,T=14,B=H-26,PW=R-L,PH=B-T;
  const last7=d.days.slice(-7);
  const groups=(d.groups||[]).filter(g=>g.days&&g.days.some(x=>x.total>0));
  const totals=last7.map(x=>x.total);
  const maxV=Math.max(...totals,...groups.map(g=>0),1);
  const avg=d.prev7Avg||0;
  const y=v=>B-(v/Math.max(maxV*1.12,1))*PH;

  let out=`<defs>
    <linearGradient id="tArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/></linearGradient>
  </defs>`;

  // 平均值虚线
  if(avg>0){
    const ay=y(Math.min(avg,maxV*1.12));
    out+=`<line x1="${L}" y1="${ay}" x2="${R}" y2="${ay}" stroke="#7b8798" stroke-opacity=".45"
            stroke-width="1" stroke-dasharray="5 5"/>`;
    out+=`<text x="${L+2}" y="${ay-5}" font-size="9.5" fill="#78849a">${fmt(avg)}</text>`;
  }

  // 堆叠柱
  const step=PW/last7.length, bw=Math.min(step*.52,30);
  last7.forEach((day,i)=>{
    const x=L+step*i+(step-bw)/2;
    let cum=B;
    groups.forEach(g=>{
      const v=g.days.find(x2=>x2.date===day.date)?.total||0;
      if(v<=0)return;
      const hh=(v/Math.max(maxV*1.12,1))*PH;
      const top=cum-hh;
      out+=`<rect x="${x}" y="${top}" width="${bw}" height="${hh}" rx="2.2" fill="${g.color}" opacity=".92"/>`;
      cum=top;
    });
    if(cum===B && totals[i]>0){
      out+=`<rect x="${x}" y="${y(totals[i])}" width="${bw}" height="${B-y(totals[i])}" rx="2.2" fill="#a78bfa" opacity=".85"/>`;
    }
    out+=`<text x="${x+bw/2}" y="${H-9}" text-anchor="middle" font-size="9.5" fill="#7c8899">${esc(day.label)}</text>`;
  });

  // 平滑趋势线 + 标记点
  const pts=totals.map((v,i)=>[L+step*i+step/2,y(v)]);
  const path=smoothPath(pts);
  if(path){
    out+=`<path d="${path} L${pts[pts.length-1][0]},${B} L${pts[0][0]},${B} Z" fill="url(#tArea)"/>`;
    out+=`<path d="${path}" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round"
             style="filter:drop-shadow(0 0 5px rgba(52,211,153,.45))"/>`;
    pts.forEach((p,i)=>{
      out+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.4" fill="#34d399" stroke="#081119" stroke-width="1.6"/>`;
    });
    // 最新值气泡
    const lp=pts[pts.length-1];
    const lbl=fmt(totals[totals.length-1]);
    const bwid=lbl.length*7+16;
    const bx=Math.min(lp[0]-bwid/2,R-bwid);
    out+=`<g><rect x="${bx}" y="${lp[1]-30}" width="${bwid}" height="17" rx="8.5" fill="#35d08a"/>
      <text x="${bx+bwid/2}" y="${lp[1]-18.5}" text-anchor="middle" font-size="10.5" font-weight="700"
       fill="#04120a" font-family="ui-monospace,Consolas,monospace">${lbl}</text></g>`;
    // 峰值菱形
    const mi=totals.indexOf(Math.max(...totals));
    if(mi>=0&&totals[mi]>0){
      const mp=pts[mi];
      out+=`<rect x="${mp[0]-3.2}" y="${mp[1]-16.5}" width="6.4" height="6.4" transform="rotate(45 ${mp[0]} ${mp[1]-13.3})"
              fill="#ff9f43"/>`;
    }
  }
  svg.innerHTML=out;
}

/* ---------------- 数据获取 ---------------- */
const DEMO={
 generatedAt:Date.now(),
 live:{lastActivityAt:Date.now()-120000,active:true},
 today:{total:16.7e6,yesterdayTotal:35.1e6,projection:21.8e6},
 prev7Avg:19.2e6, yearTotal:1.18e9,
 days:[
  {date:'2026-06-29',label:'06-29',total:27.2e6},{date:'2026-06-30',label:'06-30',total:5.1e6},
  {date:'2026-07-01',label:'07-01',total:23.8e6},{date:'2026-07-02',label:'07-02',total:25.3e6},
  {date:'2026-07-03',label:'07-03',total:9.4e6},{date:'2026-07-04',label:'07-04',total:33.0e6},
  {date:'2026-07-05',label:'07-05',total:16.7e6}],
 groups:[
  {name:'Codex',color:'#a78bfa',today:15e6,todayShare:.90,hitRate:.93,total:15e6,lastAt:Date.now()-120000,
   days:[{total:24e6},{total:4.6e6},{total:22e6},{total:23e6},{total:8.6e6},{total:31e6},{total:15e6}]},
  {name:'Claude Code',color:'#fb923c',today:1.67e6,todayShare:.10,hitRate:.72,total:1.67e6,lastAt:Date.now()-300000,
   days:[{total:3.2e6},{total:0.5e6},{total:1.8e6},{total:2.3e6},{total:0.8e6},{total:2.0e6},{total:1.67e6}]},
  {name:'Mimo',color:'#38bdf8',today:0.03e6,todayShare:0,hitRate:.55,total:0.03e6,lastAt:0,
   days:[{total:.1e6},{total:0},{total:.05e6},{total:.03e6},{total:.01e6},{total:.4e6},{total:.03e6}]}]
};

async function load(){
  try{
    if(new URLSearchParams(location.search).has('demo')){ render(DEMO); $('err').style.display='none'; schedule(); return; }
    const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),9000);
    const r=await fetch('/api/usage?t='+Date.now(),{cache:'no-store',signal:ctl.signal});
    clearTimeout(t);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(j.error==='no_database'){ showError(j.message); }
    else { $('err').style.display='none'; render(j); }
    schedule();
  }catch(e){
    showError('无法连接采集服务：'+e.message+' （确认电脑端服务在运行、手机与电脑同一局域网）');
    schedule();
  }
}
let timer=null;
function schedule(){ clearInterval(timer); timer=setInterval(load,REFRESH_MS); }
function showError(msg){
  const e=$('err'); e.textContent=msg; e.style.display='block';
  $('live').classList.add('off'); $('liveTxt').textContent='OFFLINE';
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) load(); });
load();
</script>
</body>
</html>
